let currentQuestion = 0;
let answers = [];


function startTest() {

    currentQuestion = 0;
    answers = [];

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    showQuestion();
}


function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Q" + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("questionText").textContent =
        question.q;

    document.getElementById("progress").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    const choicesDiv = document.getElementById("choices");

    choicesDiv.innerHTML = "";

    question.choices.forEach(function(choice, index) {

        const button = document.createElement("button");

        button.className = "choice";

        button.textContent =
            "①②③④⑤"[index] + " " + choice;

        button.onclick = function() {

            document.querySelectorAll(".choice").forEach(function(btn) {
                btn.classList.remove("selected");
            });

            button.classList.add("selected");

            answers[currentQuestion] = 5 - index;
        };

        choicesDiv.appendChild(button);

    });

    document.getElementById("nextButton").textContent =
        currentQuestion === questions.length - 1
        ? "결과 보기 🎉"
        : "다음";
}


function nextQuestion() {

    if (answers[currentQuestion] === undefined) {
        alert("답변을 하나 선택해주세요!");
        return;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();

    }
}


function showResult() {

    const score = answers.reduce(function(total, value) {
        return total + value;
    }, 0);

    let type;
    let description;
    let keywords;

    if (score >= 85) {

        type = "💍 결혼 준비 완료형";

        description =
            "당신은 결혼에 대해 상당히 현실적이고 긍정적인 생각을 가지고 있어요. " +
            "상대방과의 신뢰, 대화, 배려를 중요하게 생각하고 " +
            "함께 문제를 해결하려는 성향이 강합니다. " +
            "좋은 사람을 만난다면 진지한 관계로 발전할 가능성이 높은 편이에요.";

        keywords = ["신뢰", "배려", "책임감", "현실적"];

    } else if (score >= 70) {

        type = "💕 좋은 배우자 감각형";

        description =
            "당신은 결혼을 긍정적으로 바라보면서도 무조건적인 결혼보다는 " +
            "서로 잘 맞는 사람을 찾는 것을 중요하게 생각하는 편이에요. " +
            "상대방을 배려하면서도 자신의 생각을 적절하게 표현할 수 있는 타입입니다.";

        keywords = ["배려", "소통", "균형", "현실감"];

    } else if (score >= 55) {

        type = "🌿 천천히 준비하는 신중형";

        description =
            "당신은 결혼을 싫어하는 사람은 아니지만 쉽게 결정하지 않는 편이에요. " +
            "상대방을 충분히 알아보고 자신의 상황도 확인한 뒤 " +
            "신중하게 결정하려는 성향이 있습니다. " +
            "서두르지 않는 것이 오히려 당신에게 잘 맞아요.";

        keywords = ["신중함", "안정", "관찰", "준비"];

    } else if (score >= 40) {

        type = "🔎 조건을 꼼꼼하게 보는형";

        description =
            "당신은 결혼을 결정할 때 여러 가지 조건을 꼼꼼하게 확인하는 편이에요. " +
            "감정만으로 결정하기보다는 경제력, 생활습관, 가치관 등을 중요하게 생각합니다. " +
            "당신에게는 충분한 대화와 현실적인 준비가 특히 중요해요.";

        keywords = ["현실적", "조건", "신중", "안정"];

    } else {

        type = "🌈 아직은 자유가 좋은형";

        description =
            "현재의 당신은 결혼보다는 자신의 자유와 생활을 더 중요하게 생각하는 편이에요. " +
            "꼭 결혼해야 한다고 생각하지 않을 수도 있습니다. " +
            "지금은 자신의 삶을 충분히 즐기면서 좋은 인연이 생겼을 때 " +
            "천천히 생각해봐도 괜찮아요.";

        keywords = ["자유", "독립", "현재", "여유"];

    }


    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    document.getElementById("resultScore").textContent =
        score + "점";

    document.getElementById("resultType").textContent =
        type;

    document.getElementById("resultDescription").textContent =
        description;

    const keywordDiv = document.getElementById("keywords");

    keywordDiv.innerHTML = "";

    keywords.forEach(function(keyword) {

        const span = document.createElement("span");

        span.className = "keyword";

        span.textContent = "#" + keyword;

        keywordDiv.appendChild(span);

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

    document.getElementById("resultScreen").classList.add("hidden");

        document.getElementById("resultType").textContent;

    const text =
        "💍 나도 결혼할 수 있을까?\n\n" +
        "내 점수: " + score + "\n" +
        "내 결과: " + type + "\n\n" +
        "너도 한번 테스트해봐!";

    if (navigator.share) {

        navigator.share({
            title: "나도 결혼할 수 있을까?",
            text: text,
            url: window.location.href
        });

    } else {

        navigator.clipboard.writeText(
            text + "\n" + window.location.href
        );

        alert("결과가 복사되었습니다!");

    }

}

</script>

</body>
</html>
